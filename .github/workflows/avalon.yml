name: Avalon

# Redraws the profile scene every 30 minutes (weather and time of day in Lisbon,
# plus the latest GitHub stats) and publishes it to the `output` branch as a
# single commit, so main's history stays clean.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["avalon/**", ".github/workflows/avalon.yml"]

permissions:
  contents: write

concurrency:
  group: avalon
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The last published state carries the visitor tally between runs.
      - name: Recall the last watch
        run: |
          git fetch -q --depth=1 origin output && git show FETCH_HEAD:state.json > "$RUNNER_TEMP/prev-state.json" || echo "No earlier watch to recall."

      - name: Draw the isle
        run: node avalon/generate.mjs --out dist --prev "$RUNNER_TEMP/prev-state.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avalon.svg state.json
          git commit -q -m "Avalon watch: $(jq -r '"\(.local.iso) \(.local.time) · \(.phase) · \(.weather.label)"' state.json)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
